version: '3.8'

services:
  # MongoDB with Replica Set
  mongodb:
    image: mongo:8
    container_name: iot-platform-db
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch(e) { rs.initiate().ok }"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - iot-network
    restart: unless-stopped

  # MongoDB Replica Set Initialization
  mongodb-init:
    image: mongo:8
    container_name: iot-platform-db-init
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: >
      mongosh --host mongodb:27017 --eval "
        try {
          rs.status();
          print('Replica set already initialized');
        } catch(e) {
          rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]});
          print('Replica set initiated');
        }
      "
    networks:
      - iot-network
    restart: "no"

  # NATS JetStream — core streaming bus (ADR-043)
  nats:
    image: nats:2.10-alpine
    container_name: iot-platform-nats
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "4222:4222"
    volumes:
      - nats_data:/data
    networks:
      - iot-network
    restart: unless-stopped

  # Redis — real-time cache + BullMQ broker (ADR-043)
  redis:
    image: redis:7-alpine
    container_name: iot-platform-redis
    command: >
      sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          redis-server --requirepass $$REDIS_PASSWORD;
        else
          redis-server;
        fi
      "
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - iot-network
    restart: unless-stopped

  # Backend API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: iot-platform-api
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/iot_platform?replicaSet=rs0
      PORT: 3001
      HOST: 0.0.0.0
      NATS_URL: nats://nats:4222
      REDIS_URL: ${REDIS_PASSWORD:+redis://:${REDIS_PASSWORD}@redis:6379}${REDIS_PASSWORD:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LICENSE_KEY: ${LICENSE_KEY:-}
      LICENSE_SECRET: ${LICENSE_SECRET:-license-secret-change-in-production}
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
      nats:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - iot-network
    restart: unless-stopped

  # Frontend Web
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: iot-platform-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - iot-network
    restart: unless-stopped

networks:
  iot-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  nats_data:
    driver: local
  redis_data:
    driver: local
