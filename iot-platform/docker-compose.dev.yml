version: '3.8'

services:
  # PostgreSQL with TimescaleDB (Development)
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: iot-platform-db-dev
    environment:
      POSTGRES_USER: iot_platform
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: iot_platform
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iot-network-dev

  # Backend API (Development with hot-reload)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: deps  # Use deps stage for development
    container_name: iot-platform-api-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://iot_platform:dev_password@postgres:5432/iot_platform?schema=public
      PORT: 3001
      HOST: 0.0.0.0
    ports:
      - "3001:3001"
    volumes:
      # Mount source code for hot-reload
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - /app/apps/api/node_modules  # Don't mount node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iot-network-dev
    command: >
      sh -c "
        cd /app/apps/api &&
        pnpm prisma generate &&
        pnpm prisma migrate dev &&
        pnpm dev
      "

  # Frontend Web (Development with hot-reload)
  web:
    image: node:20-alpine
    container_name: iot-platform-web-dev
    working_dir: /app/apps/web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: http://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot-reload
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/apps/web/node_modules  # Don't mount node_modules
      - /app/apps/web/.next  # Don't mount .next build folder
    depends_on:
      - api
    networks:
      - iot-network-dev
    command: >
      sh -c "
        npm install -g pnpm@8.15.0 &&
        pnpm install &&
        pnpm dev
      "

networks:
  iot-network-dev:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local
