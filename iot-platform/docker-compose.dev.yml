version: '3.8'

services:
  # MongoDB with Replica Set (Development)
  mongodb:
    image: mongo:8
    container_name: iot-platform-db-dev
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch(e) { rs.initiate().ok }"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - iot-network-dev

  # MongoDB Replica Set Initialization
  mongodb-init:
    image: mongo:8
    container_name: iot-platform-db-init-dev
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: >
      mongosh --host mongodb:27017 --eval "
        try {
          rs.status();
          print('Replica set already initialized');
        } catch(e) {
          rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]});
          print('Replica set initiated');
        }
      "
    networks:
      - iot-network-dev
    restart: "no"

  # NATS JetStream — core streaming bus (ADR-043)
  nats:
    image: nats:2.10-alpine
    container_name: iot-platform-nats-dev
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "4222:4222"
    volumes:
      - nats_dev_data:/data
    networks:
      - iot-network-dev

  # Redis — real-time cache + BullMQ broker (ADR-043)
  redis:
    image: redis:7-alpine
    container_name: iot-platform-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - iot-network-dev

  # Backend API (Development with hot-reload)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: deps  # Use deps stage for development
    container_name: iot-platform-api-dev
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/iot_platform?replicaSet=rs0
      PORT: 3001
      HOST: 0.0.0.0
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      LICENSE_KEY: ${LICENSE_KEY:-}
      LICENSE_SECRET: ${LICENSE_SECRET:-license-secret-change-in-production}
    ports:
      - "3001:3001"
    volumes:
      # Mount source code for hot-reload
      - ./apps/api/src:/app/apps/api/src
      - /app/apps/api/node_modules  # Don't mount node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
      nats:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - iot-network-dev
    command: >
      sh -c "
        cd /app/apps/api &&
        pnpm dev
      "

  # Frontend Web (Development with hot-reload)
  web:
    image: node:20-alpine
    container_name: iot-platform-web-dev
    working_dir: /app/apps/web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: http://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot-reload
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/apps/web/node_modules  # Don't mount node_modules
      - /app/apps/web/.next  # Don't mount .next build folder
    depends_on:
      - api
    networks:
      - iot-network-dev
    command: >
      sh -c "
        npm install -g pnpm@8.15.0 &&
        pnpm install &&
        pnpm dev
      "

networks:
  iot-network-dev:
    driver: bridge

volumes:
  mongodb_dev_data:
    driver: local
  nats_dev_data:
    driver: local
  redis_dev_data:
    driver: local
